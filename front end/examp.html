<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RESUME</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #edf5ee;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 900px;
            margin: 40px auto;
            background: #5f4a5a;
            padding: 32px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .summary {
            margin-bottom: 32px;
            padding-bottom: 16px;
            border-bottom: 1px solid #ef8e8e;
        }
        .summary h2 {
            margin-top: 0;
            color: #1a0c0c;
        }
        .cards {
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
            background-color: rgb(157, 224, 224);
        }
        .card {
            background: #e7c8c8;
            border-radius: 6px;
            box-shadow: 0 1px 4px rgba(231, 136, 136, 0.06);
            padding: 10px;
            flex: 1 1 130px;
            min-width: 130px;
            max-width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .card h3 {
            margin-top: 0;
            color: #6d7c8b;
        }
        .card p {
            margin-bottom: 0;
            color: #c7a4a4;
        }
        @media (max-width: 500px) {
            .cards {
                flex-direction: columns;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="summary">
            <h2>Resume</h2>
            <ul>Name:S.Manohar</ul>
            <ul>Branch:CSM</ul>
            <ul>Course:BTech</ul>
        </div>
        <div>
            <h2>Projects</h2>
            <div class="cards">
                <div class="card">
                    <h3>MohanBabu University</h3>
                    <ul><li>3D printing Certificate</li></ul>
                </div>
                <div class="card">
                    <h3>Eduskills</h3>
                    <ul><li>AWS Certificate</li></ul>
                </div>
                <div class="card">
                    <h3>Hackaton</h3>
                    <ul><li>Code Buzz Certificate</li></ul>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
